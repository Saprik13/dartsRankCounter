<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Tesseract OCR smoke test</title>
    <script src="../vendor/tesseract/tesseract.min.js" defer></script>
    <script src="../js/ocr.js" defer></script>
  </head>
  <body data-status="running">
    <h1>OCR smoke test</h1>
    <pre id="output">Loading OCR assets…</pre>
    <script>
      window.addEventListener("load", async () => {
        const output = document.getElementById("output");
        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520">
            <rect width="100%" height="100%" fill="white" />
            <g fill="black" font-family="Arial, sans-serif" font-size="64">
              <text x="70" y="120">1 Форманюк Андрій</text>
              <text x="70" y="260">2 Корпусов Андрій</text>
              <text x="70" y="400">3 Томчук Олег</text>
            </g>
          </svg>`;
        const imageData = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;

        try {
          const result = await window.DartsOCR.analyze({
            imageData,
            players: [
              { name: "Форманюк Андрій" },
              { name: "Корпусов Андрій" },
              { name: "Томчук Олег" },
            ],
            nicknameMappings: {},
            tournamentType: "single_group",
            playerCount: 3,
            groupCount: 1,
            onProgress({ phase, progress }) {
              output.textContent = `${phase}: ${Math.round(progress * 100)}%`;
            },
          });
          const matched = result.results.filter(
            (item) => item.confidence !== "low",
          ).length;
          document.body.dataset.status = matched >= 2 ? "passed" : "failed";
          output.textContent = JSON.stringify(result, null, 2);
        } catch (error) {
          document.body.dataset.status = "failed";
          output.textContent = `${error.code || "ERROR"}: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
